<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital Atlas</title>
<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<canvas id="gl"></canvas>
<canvas id="fx"></canvas>

<div class="hud">
  <div class="wordmark"><b>BYU CS</b> · ORBITAL ATLAS</div>
  <div class="clock" id="clock">YEAR 00 · DAY 000</div>
  <div class="dots" id="dots"></div>
</div>
<div class="live-badge" id="liveBadge"><i></i><span>LIVE · NASA APOD</span></div>
<div class="scale-readout" id="scaleReadout">
  <div class="num" id="scaleNum">1</div>
  <div class="unit" id="scaleUnit">EARTH DIAMETER</div>
</div>
<div class="dock">
  <div class="dock-inner" id="dockInner">
    <p class="eyebrow" id="eyebrow">NIGHT SKY</p>
    <h1 class="title" id="title">Orion</h1>
    <p class="fact" id="fact">The Hunter.</p>
    <div class="meta" id="meta"></div>
  </div>
</div>

<script src="app.js"></script>
